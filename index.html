<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title">Cyber's Game Hub Survey Form</h1>
    <p id="description">Thanks for taking this survey, It helps a ton!</p>
    <form id="survey-form" action="https://formspree.io/f/moqgzaza" method="POST">
        <fieldset>
            <legend>Let's get to know you.</legend> 
            <label for="name" id="name-label">Name: <input id="name" name="name" type="text" placeholder="name" required /></label>
            <label for="email" id="email-label">Email: <input id="email" name="email" type="email" placeholder="email" required /></label>
            <label for="age" id="number-label">Age: <input id="number" type="number" name="age" min="12" max="50" placeholder="age" required/></label>
        </fieldset>
        <fieldset>
           <label>Which option best describes your gaming skills?</label> 
                <select id="dropdown" name="dropdown" required>
                    <option value="">Choose a Category</option>
                    <option value="1">Beginner</option>
                    <option value="2">Intermediate</option>
                    <option value="Professional">Professional</option>
                    <option value="4">Rather not say</option>
                </select>
            </label>
            <label>Would you recommend Cyber's Game Hub to a friend?</label>
            <label for="refer"><input  value="refer" id="refer" name="refer" type="radio" class="inline" checked> Yes</label>
            <label for="refer"><input value="refer" id="refer" name="refer" type="radio" class="inline"> Maybe</label>
            <label for="refer"><input value="refer" id="refer" name="refer" type="radio" class="inline"> Not sure</label>
            </fieldset>
        <fieldset>
            <label> What's your favourite feature of Cyber's Game Hub?</label>
            <select id="dropdown" name="fav-feature" required   >
                <option value="">Select an option</option>
                <option value="1">Tournaments</option>
                <option value="2">World chat</option>
                <option value="3">Free games</option>
                <option value="4">Gaming community</option>
            </select>
            <label for="improve">What would you like to see improved? (check all that apply) </label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline"  value="1"> Tournaments</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="2"> World chat</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="3"> Free games</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="4"> Gaming community</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="5"> Vouchers</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="6"> Discounts</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="7"> Servers</label>
            <label for="improve"><input id="improve" name="improve" type="checkbox" class="inline" value="8"> Ads</label>
            
        </fieldset>
        <fieldset>
            <label>Feel free to lay down your thoughts below.</label>
            <textarea id="suggestion" name="suggestion" rows="3" cols="30" placeholder="Give us feedback..." required></textarea>
        </fieldset>
        <input id="submit" type="submit" value="Submit" />

    </form>
</body>
</html>
